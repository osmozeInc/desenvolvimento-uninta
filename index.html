<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Meus Projetos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <div class="header__logo-box">
                <img src="https://dirin.s3.us-east-1.amazonaws.com/Banners_AVA/HORIZONTAL.png" alt="Logo" class="header__logo-img">
            </div>
            
            <div class="header__content">
                <h1 class="header__title">Workspace</h1>
                <p class="header__subtitle">Repositório central de páginas e projetos em desenvolvimento.</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="carousel">
            <h2 class="carousel__title">Selecione um projeto ou página</h2>
            
            <div class="carousel__track">
                
                <button class="card" 
                    data-type="page" 
                    data-title="Landing Page X"
                    data-image="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80">
                    <div class="card__header">
                        <span class="badge">Página Moddle</span>
                    </div>
                    <div class="card__body">
                        <h3 class="card__title">Página da CPA</h3>
                        <p class="card__desc">Página de setor de avaliação da infraestrutura do UNINTA.</p>
                    </div>
                </button>

                <button class="card" 
                    data-type="project" 
                    data-title="Dashboard Administrativo"
                    data-pages='[
                        {"name": "Pag. Genérica", "url": "./enade2026/generica.html", "message": "Não faz parte do projeto"}, 
                        {"name": "ADS + GETI", "url": "./enade2026/tabela-ads-geti.html", "message": "Aguardando 1 Materiais"}, 
                        {"name": "Arq. e Urbanismo", "url": "./enade2026/tabela-arq-urbanismo.html", "message": "Aguardando 9  Materiais"}, 
                        {"name": "Educação Física", "url": "./enade2026/tabela-ed-fisica.html", "message": "Aguardando 21 Materiais"}, 
                        {"name": "Eng. Civíl", "url": "./enade2026/tabela-eng-civil.html", "message": "Não Produzido"}, 
                        {"name": "Eng. da Computação", "url": "./enade2026/tabela-eng-computacao.html", "message": "Não Produzido"}, 
                        {"name": "Pedagogia", "url": "./enade2026/tabela-pedagogia.html", "message": "Aguardando 5 Materiais"}, 
                        {"name": "Letras", "url": "./enade2026/tabela-letras.html", "message": "Aguardando 2 Materiais"},
                        {"name": "Matemática", "url": "./enade2026/tabela-matematica.html", "message": "Página Finalizada"},
                        {"name": "História", "url": "./enade2026/tabela-historia.html", "message": "Página Finalizada"}
                    ]'>
                    <div class="card__header">
                        <span class="badge">Projeto Completo</span>
                    </div>
                    <div class="card__body">
                        <h3 class="card__title">ENADE 2026</h3>
                        <p class="card__desc">Sistema interno com gráficos e tabelas.</p>
                    </div>
                </button>

            </div>
        </section>

        <section class="view-area" id="view-area">
            <div class="view-area__empty">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <p>Nenhum item selecionado. Clique em um card acima.</p>
            </div>
        </section>
    </main>

    <script>
        const cards = document.querySelectorAll('.card');
        const viewArea = document.getElementById('view-area');

        cards.forEach(card => {
            card.addEventListener('click', () => {
                // Remove estado ativo de todos os cards
                cards.forEach(c => c.classList.remove('card--active'));
                // Adiciona ao card clicado
                card.classList.add('card--active');

                const type = card.getAttribute('data-type');
                const title = card.getAttribute('data-title');

                if (type === 'page') {
                    const imageUrl = card.getAttribute('data-image');
                    viewArea.innerHTML = `
                        <div class="view-page fade-in">
                            <div class="view-header">
                                <h3>Visualizando: ${title}</h3>
                                <a href="#" class="btn-primary">Acessar Página</a>
                            </div>
                            <div class="image-wrapper">
                                <img src="${imageUrl}" alt="${title}">
                            </div>
                        </div>
                    `;
                } else if (type === 'project') {
                    const pages = JSON.parse(card.getAttribute('data-pages'));
                    
                    // Adicionado: .sub-card-wrapper envolvendo a página e o botão de download
                    let subCardsHTML = pages.map(page => `
                        <div class="sub-card-wrapper">
                            <a href="${page.url}" class="sub-card">
                                <span class="sub-card__icon">📄</span>
                                <span class="sub-card__name">
                                    ${page.name}<br>
                                    <span class="sub-card__message">${page.message}</span>
                                </span>
                            </a>
                            <a href="${page.url}" download="${page.name}.html" class="sub-card__download" title="Baixar documento HTML: ${page.name}">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </a>
                        </div>
                    `).join('');

                    viewArea.innerHTML = `
                        <div class="view-project fade-in">
                            <div class="view-header">
                                <h3>Projeto: ${title}</h3>
                                <p>Selecione uma das páginas abaixo para acessar ou clique no botão lateral para baixar:</p>
                            </div>
                            <div class="sub-cards-grid">
                                ${subCardsHTML}
                            </div>
                        </div>
                    `;
                }
            });
        });
    </script>
</body>
</html>
